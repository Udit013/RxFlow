name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          # Same major as production (Render resolves package.json engines to Node 26).
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        # Frozen, like Vercel's install — fails if pnpm-lock.yaml is out of sync with package.json
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rxflow/db exec prisma generate

      - name: Typecheck (web)
        run: pnpm --filter @rxflow/web exec tsc --noEmit

      - name: Typecheck (api)
        run: pnpm --filter @rxflow/api exec tsc --noEmit

      - name: Lint (web — includes React rules-of-hooks)
        run: pnpm --filter @rxflow/web exec next lint

      - name: Unit tests
        run: pnpm test

      - name: Build (web)
        run: pnpm --filter @rxflow/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
