name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.1.0

      - uses: actions/setup-node@v7
        with:
          # Same major as production (Render resolves package.json engines to Node 26).
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        # Frozen, like Vercel's install — fails if pnpm-lock.yaml is out of sync with package.json
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rxflow/db exec prisma generate

      - name: Security audit (production dependencies)
        # Fails on high or critical advisories; lower ones show up in Dependabot alerts.
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck (all workspaces)
        run: pnpm type-check

      - name: Lint (ESLint flat config — includes React rules-of-hooks)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build (web)
        run: pnpm --filter @rxflow/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
