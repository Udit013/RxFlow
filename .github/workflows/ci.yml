name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm --filter @rxflow/db exec prisma generate

      - name: Typecheck (web)
        run: pnpm --filter @rxflow/web exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build (web)
        run: pnpm --filter @rxflow/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
