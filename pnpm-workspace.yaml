packages:
  - 'apps/*'
  - 'packages/*'

# Security overrides for transitive packages (patched releases in the same major).
# Kept identical to `pnpm.overrides` in package.json: pnpm 9 (used by Render/Vercel via
# packageManager) reads that field; pnpm 10+ reads this file instead.
overrides:
  'fast-uri': '^3.1.9'
  'follow-redirects': '^1.16.1'
  'nanoid@3': '^3.3.18'
  'source-map-js': '^1.2.2'
  'fflate': '^0.8.3'
  'fast-copy': '^3.1.0'
  'postcss': '^8.5.23'
  'browserslist': '^4.28.7'
  'baseline-browser-mapping': '^2.11.0'
  'postcss-selector-parser@6': '^6.1.3'
  'js-yaml@4': '^4.3.2'
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@2': '^2.1.7'
  'vite': '^8.3.5'
